<svg xmlns="http://www.w3.org/2000/svg" width="739" height="570" viewBox="0 0 739 570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" role="img" aria-label="Remove a Makefile target: CAUGHT">
<rect width="739" height="570" rx="12" fill="#0d1117"/>
<text x="22" y="38" fill="#e6edf3" font-size="16" font-weight="bold">Remove a Makefile target</text>
<rect x="648" y="20" width="69" height="26" rx="13" fill="#238636"/>
<text x="682.5" y="37" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">CAUGHT</text>
<rect x="22" y="62" width="695" height="122" rx="8" fill="#161b22"/>
<text x="36" y="84" fill="#8b949e" font-size="11" letter-spacing="0.5">You change</text>
<text x="36" y="106" fill="#8b949e" xml:space="preserve">Makefile</text>
<text x="36" y="125" fill="#ff7b72" xml:space="preserve">-deploy:</text>
<text x="36" y="144" fill="#7ee787" xml:space="preserve">+other:</text>
<text x="36" y="163" fill="#e6edf3" xml:space="preserve"> 	echo</text>
<rect x="22" y="196" width="695" height="65" rx="8" fill="#161b22"/>
<text x="36" y="218" fill="#8b949e" font-size="11" letter-spacing="0.5">README.md says</text>
<text x="36" y="240" fill="#e6edf3" xml:space="preserve">Run `make deploy` to ship.</text>
<rect x="22" y="273" width="695" height="179" rx="8" fill="#161b22"/>
<text x="36" y="295" fill="#8b949e" font-size="11" letter-spacing="0.5">readme-drift says</text>
<text x="36" y="317" fill="#e6edf3" xml:space="preserve">readme-drift: ❌ README.md may be stale:</text>
<text x="36" y="355" fill="#e6edf3" xml:space="preserve">  • `deploy` was removed</text>
<text x="36" y="374" fill="#e6edf3" xml:space="preserve">    in Makefile</text>
<text x="36" y="393" fill="#e6edf3" xml:space="preserve">    referenced in README.md line 1: …Run `make deploy` to ship.…</text>
<text x="36" y="431" fill="#e6edf3" xml:space="preserve">  → Please update the README or run with --no-verify to skip.</text>
<rect x="22" y="464" width="695" height="84" rx="8" fill="#161b22"/>
<text x="36" y="486" fill="#8b949e" font-size="11" letter-spacing="0.5">Why</text>
<text x="36" y="508" fill="#e6edf3" xml:space="preserve">The deploy target is gone, but the README still says make deploy. The removed name is</text>
<text x="36" y="527" fill="#e6edf3" xml:space="preserve">found in the README, so it is flagged.</text>
</svg>
