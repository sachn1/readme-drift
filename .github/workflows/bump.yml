name: Bump Version

on:
  push:
    branches:
      - develop
      - master

jobs:
  bump:
    name: Bump Version
    runs-on: ubuntu-latest
    # Skip the bump commit itself to avoid an infinite trigger loop
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry and Commitizen
        run: |
          pip install poetry
          poetry install --only dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # On develop: bump to the next RC (e.g. 0.1.0 -> 0.2.0-rc.0, then 0.2.0-rc.1, ...)
      # cz bump updates pyproject.toml and creates a commit, but tag creation can be
      # unreliable with version_provider=poetry in CI -- so we create the tag explicitly.
      # Exit code 21 means "no conventional commits found - nothing to bump".
      - name: Bump RC version
        if: github.ref == 'refs/heads/develop'
        run: |
          OLD_VERSION=$(poetry version -s)
          EXIT=0
          poetry run cz bump --prerelease rc --yes || EXIT=$?
          if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 21 ]; then
            exit $EXIT
          fi
          NEW_RAW=$(poetry version -s)
          if [ "$NEW_RAW" != "$OLD_VERSION" ]; then
            # Normalise to semver format: cz may write 1.0.0rc1 (PEP 440) to pyproject.toml
            # even when version_scheme=semver2. poetry version is a no-op for this conversion
            # because it treats the two forms as equivalent, so we patch the file directly.
            NORM=$(echo "$NEW_RAW" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)rc([0-9]+)$/\1-rc.\2/')
            if [ "$NORM" != "$NEW_RAW" ]; then
              sed -i -E "s/^(version = \")${NEW_RAW}\"/\1${NORM}\"/" pyproject.toml
              git add pyproject.toml
              git commit --amend --no-edit
            fi
            # cz bump already created a tag on the pre-amend commit; delete it so we can
            # recreate it pointing at the correct (possibly amended) commit.
            git tag -d "v${NORM}" 2>/dev/null || true
            git tag -d "v${NEW_RAW}" 2>/dev/null || true
            git tag -a "v${NORM}" -m "version v${NORM}"
          fi

      # On master: strip the RC suffix from the current version (e.g. 1.0.0-rc.1 -> 1.0.0).
      # Handles both semver (1.0.0-rc.1) and PEP 440 (1.0.0rc1) formats for safety.
      # Skips silently if the current version is already a release.
      - name: Promote RC to release
        if: github.ref == 'refs/heads/master'
        run: |
          CURRENT=$(poetry version -s)
          if [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]] || \
             [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)rc[0-9]+$ ]]; then
            RELEASE="${BASH_REMATCH[1]}"
            poetry version "$RELEASE"
            git add pyproject.toml
            git commit -m "bump: version $CURRENT -> $RELEASE"
            git tag -a "v$RELEASE" -m "version v$RELEASE"
          fi

      - name: Push
        run: git push --follow-tags
