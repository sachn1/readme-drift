<svg xmlns="http://www.w3.org/2000/svg" width="739" height="456" viewBox="0 0 739 456" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" role="img" aria-label="Change behaviour, keep the signature: NOT TRACKED">
<rect width="739" height="456" rx="12" fill="#0d1117"/>
<text x="22" y="38" fill="#e6edf3" font-size="16" font-weight="bold">Change behaviour, keep the signature</text>
<rect x="610" y="20" width="107" height="26" rx="13" fill="#6e7681"/>
<text x="663.5" y="37" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">NOT TRACKED</text>
<rect x="22" y="62" width="695" height="122" rx="8" fill="#161b22"/>
<text x="36" y="84" fill="#8b949e" font-size="11" letter-spacing="0.5">You change</text>
<text x="36" y="106" fill="#8b949e" xml:space="preserve">client.py</text>
<text x="36" y="125" fill="#e6edf3" xml:space="preserve"> def fetch(url):</text>
<text x="36" y="144" fill="#ff7b72" xml:space="preserve">-    return 1</text>
<text x="36" y="163" fill="#7ee787" xml:space="preserve">+    return 2</text>
<rect x="22" y="196" width="695" height="65" rx="8" fill="#161b22"/>
<text x="36" y="218" fill="#8b949e" font-size="11" letter-spacing="0.5">README.md says</text>
<text x="36" y="240" fill="#e6edf3" xml:space="preserve">`fetch` returns a sorted list.</text>
<rect x="22" y="273" width="695" height="65" rx="8" fill="#161b22"/>
<text x="36" y="295" fill="#8b949e" font-size="11" letter-spacing="0.5">readme-drift says</text>
<text x="36" y="317" fill="#e6edf3" xml:space="preserve">readme-drift: ✅ No README staleness detected.</text>
<rect x="22" y="350" width="695" height="84" rx="8" fill="#161b22"/>
<text x="36" y="372" fill="#8b949e" font-size="11" letter-spacing="0.5">Why</text>
<text x="36" y="394" fill="#e6edf3" xml:space="preserve">The signature is identical, so nothing looks changed. Only names and signatures are</text>
<text x="36" y="413" fill="#e6edf3" xml:space="preserve">compared, not what the code does.</text>
</svg>
