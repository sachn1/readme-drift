<svg xmlns="http://www.w3.org/2000/svg" width="739" height="684" viewBox="0 0 739 684" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" role="img" aria-label="Rename a class shown in a mermaid diagram: CAUGHT">
<rect width="739" height="684" rx="12" fill="#0d1117"/>
<text x="22" y="38" fill="#e6edf3" font-size="16" font-weight="bold">Rename a class shown in a mermaid diagram</text>
<rect x="648" y="20" width="69" height="26" rx="13" fill="#238636"/>
<text x="682.5" y="37" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">CAUGHT</text>
<rect x="22" y="62" width="695" height="122" rx="8" fill="#161b22"/>
<text x="36" y="84" fill="#8b949e" font-size="11" letter-spacing="0.5">You change</text>
<text x="36" y="106" fill="#8b949e" xml:space="preserve">client.py</text>
<text x="36" y="125" fill="#ff7b72" xml:space="preserve">-class Client:</text>
<text x="36" y="144" fill="#7ee787" xml:space="preserve">+class Session:</text>
<text x="36" y="163" fill="#e6edf3" xml:space="preserve">     pass</text>
<rect x="22" y="196" width="695" height="179" rx="8" fill="#161b22"/>
<text x="36" y="218" fill="#8b949e" font-size="11" letter-spacing="0.5">README.md says</text>
<text x="36" y="240" fill="#e6edf3" xml:space="preserve">```mermaid</text>
<text x="36" y="259" fill="#e6edf3" xml:space="preserve">classDiagram</text>
<text x="36" y="278" fill="#e6edf3" xml:space="preserve">    class Client {</text>
<text x="36" y="297" fill="#e6edf3" xml:space="preserve">        +connect()</text>
<text x="36" y="316" fill="#e6edf3" xml:space="preserve">        +run()</text>
<text x="36" y="335" fill="#e6edf3" xml:space="preserve">    }</text>
<text x="36" y="354" fill="#e6edf3" xml:space="preserve">```</text>
<rect x="22" y="387" width="695" height="179" rx="8" fill="#161b22"/>
<text x="36" y="409" fill="#8b949e" font-size="11" letter-spacing="0.5">readme-drift says</text>
<text x="36" y="431" fill="#e6edf3" xml:space="preserve">readme-drift: ❌ README.md may be stale:</text>
<text x="36" y="469" fill="#e6edf3" xml:space="preserve">  • `Client` was removed</text>
<text x="36" y="488" fill="#e6edf3" xml:space="preserve">    in client.py</text>
<text x="36" y="507" fill="#e6edf3" xml:space="preserve">    referenced in README.md line 3: …class Client {…</text>
<text x="36" y="545" fill="#e6edf3" xml:space="preserve">  → Please update the README or run with --no-verify to skip.</text>
<rect x="22" y="578" width="695" height="84" rx="8" fill="#161b22"/>
<text x="36" y="600" fill="#8b949e" font-size="11" letter-spacing="0.5">Why</text>
<text x="36" y="622" fill="#e6edf3" xml:space="preserve">Names inside a mermaid classDiagram are matched like backtick spans, so the stale Client</text>
<text x="36" y="641" fill="#e6edf3" xml:space="preserve">in the diagram is found.</text>
</svg>
