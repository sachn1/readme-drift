<svg xmlns="http://www.w3.org/2000/svg" width="739" height="513" viewBox="0 0 739 513" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" role="img" aria-label="The build target is removed, README still says make build: MISSED (known gap)">
<rect width="739" height="513" rx="12" fill="#0d1117"/>
<text x="22" y="38" fill="#e6edf3" font-size="16" font-weight="bold">The build target is removed, README still says make build</text>
<rect x="557" y="20" width="160" height="26" rx="13" fill="#9e6a03"/>
<text x="637.0" y="37" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">MISSED (known gap)</text>
<rect x="22" y="62" width="695" height="122" rx="8" fill="#161b22"/>
<text x="36" y="84" fill="#8b949e" font-size="11" letter-spacing="0.5">You change</text>
<text x="36" y="106" fill="#8b949e" xml:space="preserve">Makefile</text>
<text x="36" y="125" fill="#ff7b72" xml:space="preserve">-build:</text>
<text x="36" y="144" fill="#7ee787" xml:space="preserve">+package:</text>
<text x="36" y="163" fill="#e6edf3" xml:space="preserve"> 	echo</text>
<rect x="22" y="196" width="695" height="65" rx="8" fill="#161b22"/>
<text x="36" y="218" fill="#8b949e" font-size="11" letter-spacing="0.5">README.md says</text>
<text x="36" y="240" fill="#e6edf3" xml:space="preserve">Run `make build` to package it.</text>
<rect x="22" y="273" width="695" height="103" rx="8" fill="#161b22"/>
<text x="36" y="295" fill="#8b949e" font-size="11" letter-spacing="0.5">readme-drift says</text>
<text x="36" y="317" fill="#e6edf3" xml:space="preserve">readme-drift: ✅ No README staleness detected.</text>
<text x="36" y="336" fill="#e6edf3" xml:space="preserve">readme-drift: ℹ 1 changed symbol matched the README as plain text but was noise-</text>
<text x="36" y="355" fill="#e6edf3" xml:space="preserve">  suppressed (no backtick match) — run with --verbose for details.</text>
<rect x="22" y="388" width="695" height="103" rx="8" fill="#161b22"/>
<text x="36" y="410" fill="#8b949e" font-size="11" letter-spacing="0.5">Why</text>
<text x="36" y="432" fill="#e6edf3" xml:space="preserve">The README now points at a target that no longer exists, and nothing is flagged. build</text>
<text x="36" y="451" fill="#e6edf3" xml:space="preserve">is a very common word, so it only counts inside a backtick span that starts with it, and</text>
<text x="36" y="470" fill="#e6edf3" xml:space="preserve">this span starts with make.</text>
</svg>
